[project]
name = "ozon-mcp"
version = "0.1.0"
description = "Model Context Protocol server for the ozon.ru buyer account: orders, cart, favorites, product cards, purchase history and catalog search over the internal composer-api."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Alexander Zhukov" }]
requires-python = ">=3.13"
dependencies = [
    "mcp>=1.2,<2",
    "playwright>=1.40",
    "curl-cffi>=0.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
]

[project.scripts]
ozon-mcp = "ozon_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ozon_mcp"]

[dependency-groups]
dev = ["ruff>=0.6", "ty>=0.0.1a1", "pytest>=8", "pytest-asyncio>=0.23"]

[tool.uv]
# ty (Astral's type checker) only ships pre-release builds for now.
prerelease = "allow"

[tool.ruff]
line-length = 120
preview = true
target-version = "py313"
src = ["src", "tests"]
fix = true
unsafe-fixes = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203", "D213",          # conflicting docstring styles
    "COM812", "ISC001",      # formatter-managed
    "TD002", "TD003", "FIX002",  # allow bare TODOs
    "PLR0913",               # arg count handled by pylint max-args
    "S310",                  # scheme validated for ozon.ru URLs
    "TRY003", "EM101", "EM102",  # inline exception messages ok here
    "CPY001",                # no per-file copyright header (see LICENSE)
    "D100", "D101", "D102", "D103", "D104", "D105", "D107",  # not every symbol needs a docstring
    "D205", "D401", "DOC201", "DOC501",  # docstring summary/section formatting
    "ANN401",                # Ozon widget JSON is genuinely `Any`
    "RUF001", "RUF002", "RUF003",  # intentional Cyrillic in strings/docstrings
    "RUF012",                # pydantic manages mutable model defaults safely
    "PLR2004",               # parsing offsets read fine as literals
    "DTZ011",                # date.today() drives current-year inference
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "INP001"]
# FastMCP evaluates tool annotations at runtime, so model imports must stay
# out of a TYPE_CHECKING block here.
"src/ozon_mcp/server.py" = ["TC001", "TC002", "TC003"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.pylint]
max-args = 7

[tool.ruff.format]
quote-style = "double"

[tool.ty.rules]
all = "error"
# FastMCP's `@mcp.tool()` decorator is untyped, so every tool would otherwise
# be flagged; the tools are thin and covered by their own signatures.
dynamic-function-decorator-return = "ignore"

[tool.ty.src]
include = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
